<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Actividad práctica V</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f2f4f7; display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; }
  form { background: #fff; padding: 28px; border-radius: 10px; width: 300px; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
  h1 { font-size: 1.3rem; margin: 0 0 18px; }
  label { display: block; font-size: .9rem; margin-top: 12px; }
  input { width: 100%; box-sizing: border-box; padding: 9px; margin-top: 4px; border: 1px solid #aab; border-radius: 6px; font-size: 1rem; }
  button { width: 100%; margin-top: 20px; padding: 10px; border: 0; border-radius: 6px; background: #2457c5; color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #mensaje { margin-top: 14px; min-height: 1.2em; color: #b3261e; font-size: .9rem; text-align: center; }
</style>
</head>
<body>
<form id="loginForm">
  <h1>Iniciar sesión</h1>
  <label for="usuario">Usuario</label>
  <input id="usuario" type="text" autocomplete="username" required>
  <label for="password">Contraseña</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <button type="submit" id="btn">Enviar</button>
  <div id="mensaje" role="alert"></div>
</form>

<script>
  // ====== CONFIGURACIÓN (revisa que coincida con tu actividad) ======
  const SUPABASE_URL = "https://hypxybgvxvpwfqflijty.supabase.co";
  const SUPABASE_KEY = "sb_publishable_x6A2XiGzM9F2QIk9xwBUvA_UK3HoJJz";
  const TABLA = "usuarios";          // nombre de tu tabla
  const COL_USUARIO = "usuario";     // columna del usuario
  const COL_PASSWORD = "contrasena"; // columna de la contraseña
  // ==================================================================

  const form = document.getElementById("loginForm");
  const msg = document.getElementById("mensaje");
  const btn = document.getElementById("btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    btn.disabled = true;

    const usuario = document.getElementById("usuario").value.trim();
    const password = document.getElementById("password").value;

    try {
      let valido = false;

      // 1) Supabase Auth (usuarios con correo, ej. cehg@aunar.com)
      const authRes = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email: usuario, password: password })
      });
      if (authRes.ok) valido = true;

      // 2) Si no, buscar en la tabla de la base de datos
      if (!valido) {
        const url = `${SUPABASE_URL}/rest/v1/${TABLA}`
          + `?select=${COL_USUARIO}`
          + `&${COL_USUARIO}=eq.${encodeURIComponent(usuario)}`
          + `&${COL_PASSWORD}=eq.${encodeURIComponent(password)}`
          + `&limit=1`;
        const res = await fetch(url, { headers: { apikey: SUPABASE_KEY } });
        if (res.ok) valido = (await res.json()).length > 0;
      }

      if (valido) {
        sessionStorage.setItem("usuario", usuario);
        window.location.href = "bienvenida.html";
      } else {
        msg.textContent = "Usuario inválido";
      }
    } catch (err) {
      msg.textContent = "No se pudo conectar con la base de datos";
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
